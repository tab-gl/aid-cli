[package]
name = "ace-id-cli"
version = "2.0.1"
edition = "2021"
rust-version = "1.75"
description = "Ace Identity Console - Rust CLI for AIDC applications and OAuth clients"
license = "MIT"
repository = "https://github.com/tab-gl/aid-cli"

[lib]
name = "ace_id_cli"
path = "src/lib.rs"

[[bin]]
name = "aid"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
getrandom = "0.2"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
url = "2"
terminal_size = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
