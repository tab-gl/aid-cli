name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Validate package
        run: npm pack --dry-run
      - name: Smoke test CLI aliases
        run: |
          node bin/aid.js --help
          node bin/aid.js --version
          node bin/ace-id.js --version
          node bin/aidc.js --version
