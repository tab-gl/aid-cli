# This workflow publishes the legacy Node.js v1 package.
# Rust v2 releases are published by rust-v2.yml and must never publish v1.

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    if: ${{ !startsWith(github.event.release.tag_name, 'v2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-npm:
    if: ${{ !startsWith(github.event.release.tag_name, 'v2') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
