name: Rust v2 CI

# Rust v2 lives entirely under rust/ on the v2-rust branch. This workflow is
# additive: the v1 workflow (.github/workflows/ci.yml) is untouched and keeps
# validating the Node implementation on master.

on:
  push:
    branches: [v2-rust]
    tags: ['v2*']
    paths:
      - "rust/**"
      - ".github/workflows/rust-v2.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: fmt + clippy + test + release build (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test the binary
        run: |
          ./target/release/aid --version
          ./target/release/aid --help > /dev/null
          ./target/release/aid definitely-not-a-command || test $? -eq 1

      - name: Report binary size
        run: ls -l target/release/aid

      - name: Upload validation binary
        uses: actions/upload-artifact@v4
        with:
          name: validate-aid-x86_64-unknown-linux-gnu
          path: rust/target/release/aid
          if-no-files-found: error

  build:
    name: build + run ${{ matrix.target }}
    # These targets build and run natively on their matching GitHub runners.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: aid
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: aid
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: aid.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: aid
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: aid
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run the binary (native)
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          "$BIN" --version
          "$BIN" --help > "$RUNNER_TEMP/aid-help.txt"
          grep -q USAGE "$RUNNER_TEMP/aid-help.txt"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/aidcfg"
          mkdir -p "$XDG_CONFIG_HOME"
          "$BIN" logout

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aid-${{ matrix.target }}
          path: rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

  android:
    name: build Android ${{ matrix.target }}
    # Android binaries are cross-compiled with the official Android NDK.
    # They are ELF executables for Termux, not APKs.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            target_env: AARCH64_LINUX_ANDROID
            linker: aarch64-linux-android24-clang
          - target: armv7-linux-androideabi
            target_env: ARMV7_LINUX_ANDROIDEABI
            linker: armv7a-linux-androideabi24-clang
          - target: x86_64-linux-android
            target_env: X86_64_LINUX_ANDROID
            linker: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        env:
          ANDROID_TARGET_ENV: ${{ matrix.target_env }}
          ANDROID_LINKER: ${{ matrix.linker }}
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;27.2.12479018"
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${ANDROID_TARGET_ENV}_LINKER=$NDK_BIN/$ANDROID_LINKER" >> "$GITHUB_ENV"
          echo "CC=$NDK_BIN/$ANDROID_LINKER" >> "$GITHUB_ENV"
          echo "AR=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        env:
          ANDROID_RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$ANDROID_RUST_TARGET"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android-${{ matrix.target }}

      - name: Build Android binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Inspect Android ELF binary
        run: |
          file target/${{ matrix.target }}/release/aid
          readelf -h target/${{ matrix.target }}/release/aid | grep -E 'Class:|Machine:'

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: aid-${{ matrix.target }}
          path: rust/target/${{ matrix.target }}/release/aid
          if-no-files-found: error

  linux-arm32:
    name: build linux armv7 (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add armv7-unknown-linux-gnueabihf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: linux-arm32

      - name: Build
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
        run: cargo build --release --target armv7-unknown-linux-gnueabihf

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aid-armv7-unknown-linux-gnueabihf
          path: rust/target/armv7-unknown-linux-gnueabihf/release/aid
          if-no-files-found: error

  release:
    name: publish v2 release
    if: startsWith(github.ref, 'refs/tags/v2')
    needs: [validate, build, android, linux-arm32]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage binaries and checksums
        run: |
          set -euo pipefail
          mkdir -p ../release
          for dir in ../dist/aid-*; do
            target="${dir#../dist/aid-}"
            cp "$dir/aid" "../release/aid-$target" 2>/dev/null || cp "$dir/aid.exe" "../release/aid-$target.exe"
          done
          cd ../release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          body: |
            Rust v2 release of the Ace ID CLI.

            Native binaries are published for Linux, Windows and macOS.
            Android NDK binaries are published for Termux on ARM64, ARMv7 and x86_64.
            All binaries are accompanied by SHA256SUMS.

            Verify a download with `sha256sum -c SHA256SUMS --ignore-missing`.

            These artifacts are independent of the v1 npm package (`ace-id`) and
            do not replace any v1 release asset.

  publish-npm:
    name: publish ace-id-cli to npm (single package)
    if: startsWith(github.ref, 'refs/tags/v2')
    needs: [validate, build, android, linux-arm32]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: aid-*
          path: dist

      - name: Assemble bundled package
        shell: bash
        run: |
          set -euo pipefail
          pkg=npm/ace-id-cli
          place() { # target os arch exe
            mkdir -p "$pkg/$2/$3"
            cp "dist/aid-$1/$4" "$pkg/$2/$3/$4"
            chmod +x "$pkg/$2/$3/$4"
          }
          place x86_64-unknown-linux-gnu linux x64 aid
          place aarch64-unknown-linux-gnu linux arm64 aid
          place armv7-unknown-linux-gnueabihf linux arm32 aid
          place x86_64-pc-windows-msvc win32 x64 aid.exe
          place aarch64-apple-darwin darwin arm64 aid
          place x86_64-apple-darwin darwin x64 aid
          place aarch64-linux-android android arm64 aid
          place armv7-linux-androideabi android arm32 aid
          place x86_64-linux-android android x64 aid
          chmod +x "$pkg/bin/aid.js"
          crate_version="$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)"
          pkg_version="$(node -p "require('./$pkg/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$crate_version" ] || [ "$tag_version" != "$pkg_version" ]; then
            echo "Version mismatch: tag=$tag_version cargo=$crate_version npm=$pkg_version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Publish
        working-directory: npm/ace-id-cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
