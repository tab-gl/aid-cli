name: Rust v2 CI

# Rust v2 lives entirely under rust/ on the v2-rust branch. This workflow is
# additive: the v1 workflow (.github/workflows/ci.yml) is untouched and keeps
# validating the Node implementation on master.

on:
  push:
    branches: [v2-rust]
    paths:
      - "rust/**"
      - ".github/workflows/rust-v2.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: fmt + clippy + test + release build (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build release binary
        run: cargo build --release

      - name: Report binary size
        run: ls -l target/release/aid

      - name: Upload linux x86_64 binary
        uses: actions/upload-artifact@v4
        with:
          name: aid-x86_64-unknown-linux-gnu
          path: rust/target/release/aid
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
            artifact: aid
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            linker: ""
            artifact: aid.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            linker: ""
            artifact: aid
          - target: x86_64-apple-darwin
            os: macos-latest
            linker: ""
            artifact: aid
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install cross linker (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test (native targets only)
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.artifact }} --version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aid-${{ matrix.target }}
          path: rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: publish v2 release
    if: startsWith(github.ref, 'refs/tags/v2')
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage binaries and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in dist/aid-*; do
            target="${dir#dist/aid-}"
            cp "$dir/aid" "release/aid-$target" 2>/dev/null || cp "$dir/aid.exe" "release/aid-$target.exe"
          done
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          body: |
            Rust v2 release of the Ace ID CLI.

            Binaries are published as `aid-<target>` with a `SHA256SUMS` file.
            Verify a download with `sha256sum -c SHA256SUMS --ignore-missing`.

            These artifacts are independent of the v1 npm package (`ace-id`) and
            do not replace any v1 release asset.
