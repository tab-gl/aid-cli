name: Rust v2 CI

# Rust v2 lives entirely under rust/ on the v2-rust branch. This workflow is
# additive: the v1 workflow (.github/workflows/ci.yml) is untouched and keeps
# validating the Node implementation on master.

on:
  push:
    branches: [v2-rust]
    tags: ['v2*']
    paths:
      - "rust/**"
      - ".github/workflows/rust-v2.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: fmt + clippy + test + release build (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test the binary
        run: |
          ./target/release/aid --version
          ./target/release/aid --help > /dev/null
          ./target/release/aid definitely-not-a-command || test $? -eq 1

      - name: Report binary size
        run: ls -l target/release/aid

      - name: Upload validation binary
        uses: actions/upload-artifact@v4
        with:
          name: validate-aid-x86_64-unknown-linux-gnu
          path: rust/target/release/aid
          if-no-files-found: error

  build:
    name: build + run ${ matrix.target }
    # These targets build and run natively on their matching GitHub runners.
    runs-on: ${${ matrix.os ÃÂ§}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: aid
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: aid
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: aid.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: aid
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: aid
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${${ matrix.target ÃÂ§}}

      - name: Build
        run: cargo build --release --target ${${ matrix.target ÃÂ§}}

      - name: Run the binary (native)
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${${ matrix.target ÃÂ§}}/release/${${ matrix.artifact ÃÂ§}}"
          "$BIN" --version
          "$BIN" --help > "$RUNNER_TEMP/aid-help.txt"
          grep -q USAGE "$RUNNER_TEMP/aid-help.txt"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/aidcfg"
          mkdir -p "$XDG_CONFIG_HOME"
          "$BIN" logout

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aid-${${ matrix.target ÃÂ§}}
          path: rust/target/${${ matrix.target ÃÂ§}}/release/${${ matrix.artifact ÃÂ§}}
          if-no-files-found: error

  android:
    name: build Android ${${ matrix.target ÃÂ§}}
    # Android binaries are cross-compiled with the official Android NDK.
    # They are ELF executables for Termux, not APKs.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            target_env: AARCH64_LINUX_ANDROID
            linker: aarch64-linux-android24-clang
          - target: armv7-linux-androideabi
            target_env: ARMV7_LINUX_ANDROIDEABI
            linker: armv7a-linux-androideabi24-clang
          - target: x86_64-linux-android
            target_env: X86_64_LINUX_ANDROID
            linker: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        env:
          ANDROID_TARGET_ENV: ${{ matrix.target_env }}
          ANDROID_LINKER: ${{ matrix.linker }}
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;27.2.12479018"
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${ANDROID_TARGET_ENV}_LINKER=$NDK_BIN/$ANDROID_LINKER" >> "$GITHUB_ENV"
          echo "CC=$NDK_BIN/$ANDROID_LINKER" >> "$GITHUB_ENV"
          echo "AR=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        env:
          ANDROID_RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$ANDROID_RUST_TARGET"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android-${${ matrix.target ÃÂ§}}

      - name: Build Android binary
        run: cargo build --release --target ${${ matrix.target ÃÂ§}}

      - name: Inspect Android ELF binary
        run: |
          file target/${${ matrix.target ÃÂ§}}/release/aid
          readelf -h target/${${ matrix.target ÃÂ§}}/release/aid | grep -E 'Class:|Machine:'

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: aid-${${ matrix.target ÃÂ§}}
          path: rust/target/${${ matrix.target ÃÂ§}}/release/aid
          if-no-files-found: error

  release:
    name: publish v2 release
    if: startsWith(github.ref, 'refs/tags/v2')
    needs: [validate, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage binaries and checksums
        run: |
          set -euo pipefail
          mkdir -p ../release
          for dir in ../dist/aid-*; do
            target="${dir#../dist/aid-}"
            cp "$dir/aid" "../release/aid-$target" 2>/dev/null || cp "$dir/aid.exe" "../release/aid-$target.exe"
          done
          cd ../release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          body: |
            Rust v2 release of the Ace ID CLI.

            Native binaries are published for Linux, Windows and macOS.
            Android NDK binaries are published for Termux on ARM64, ARMv7 and x86_64.
            All binaries are accompanied by SHA256SUMS.

            Verify a download with `sha256sum -c SHA256SUMS --ignore-missing`.

            These artifacts are independent of the v1 npm package (`ace-id`) and
            do not replace any v1 release asset.

  publish-npm:
    name: publish Rust v2 to npm
    if: startsWith(github.ref, 'refs/tags/v2')
    needs: [validate, build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: aid-*
          path: dist
          merge-multiple: false

      - name: Verify tag matches Cargo version and stage npm targets
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ace-id-cli") | .version')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "Tag version ($tag_version) does not match rust/Cargo.toml ($crate_version)." >&2
            exit 1
          fi

          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-pc-windows-msvc \
            aarch64-apple-darwin \
            x86_64-apple-darwin; do
            mkdir -p "target/$target/release"
            if [ -f "../dist/aid-$target/aid.exe" ]; then
              cp "../dist/aid-$target/aid.exe" "target/$target/release/aid.exe"
            else
              cp "../dist/aid-$target/aid" "target/$target/release/aid"
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install cargo-npm
        run: cargo install --locked cargo-npm

      - name: Generate platform packages
        run: cargo npm generate

      - name: Authenticate with npm
        run: npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${${ secrets.NPM_TOKEN ÃÂ§}}

      - name: Publish platform packages and CLI
        run: cargo npm publish
        env:
          NODE_AUTH_TOKEN: ${${ secrets.NPM_TOKEN ÃÂ§}}
